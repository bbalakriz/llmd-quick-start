apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: gpt-oss-20b-pfd
  namespace: llmd-test
annotations:
  security.opendatahub.io/enable-auth: 'false'
spec:
  replicas: 1
  model:
    uri: <patch-me>
    name: openai/gpt-oss-20b
  router:
    scheduler: {}
    gateway: {}
    route: 
      targetPort: 9002
  template:
    containers:
      - name: main
        env:
          # disable uvicorn access log to reduce log noise
          # Enable KV cache transfer via NixlConnector (RDMA-based)
          - name: VLLM_ADDITIONAL_ARGS
            value: "--disable-uvicorn-access-log --kv-transfer-config '{\"kv_connector\":\"NixlConnector\",\"kv_role\":\"kv_both\"}' --block-size 128"
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_LOGGING_LEVEL
            value: "DEBUG"
          - name: VLLM_NIXL_ABORT_REQUEST_TIMEOUT
            value: "100000"
        resources:
          limits:
            cpu: '4'
            memory: 16Gi
            nvidia.com/gpu: '1'
          requests:
            cpu: '1'
            memory: 8Gi
            nvidia.com/gpu: '1'
        livenessProbe:
          initialDelaySeconds: 10
        startupProbe:
          httpGet:
            path: /health
            port: 8001
            scheme: HTTPS
          failureThreshold: 60
          periodSeconds: 10
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
  prefill:
    replicas: 1
    template:
      containers:
        - name: main
          env:
            # disable uvicorn access log to reduce log noise
            # Enable KV cache transfer via NixlConnector (RDMA-based)
            - name: VLLM_ADDITIONAL_ARGS
              value: "--disable-uvicorn-access-log --kv-transfer-config '{\"kv_connector\":\"NixlConnector\",\"kv_role\":\"kv_producer\"}' --block-size 128"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_LOGGING_LEVEL
              value: "DEBUG"
            - name: VLLM_NIXL_ABORT_REQUEST_TIMEOUT
              value: "100000"
          resources:
            limits:
              cpu: '4'
              memory: 16Gi
              nvidia.com/gpu: '1'
            requests:
              cpu: '1'
              memory: 8Gi
              nvidia.com/gpu: '1'
          livenessProbe:
            initialDelaySeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTPS
            failureThreshold: 60
            periodSeconds: 10
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: gpt-oss-20b-pfd-inference-pool
  namespace: llmd-test
spec:
  endpointPickerRef:
    failureMode: FailClose
    group: ''
    kind: Service
    name: gpt-oss-20b-pfd-epp-service
    port:
      number: 9002
  selector:
    matchLabels:
      app.kubernetes.io/name: gpt-oss-20b-pfd
      app.kubernetes.io/part-of: llminferenceservice
      kserve.io/component: workload
  targetPorts:
    - number: 8000
---