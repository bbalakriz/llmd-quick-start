apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llmd-test

namePrefix: llm-d-

resources:
  - ../../base

patches:
  - target:
      kind: Job
      name: guidellm-benchmark
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "http://openshift-ai-inference-openshift-default.openshift-ingress.svc.cluster.local/llmd-test/qwen/v1"
